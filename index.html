
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <h1 class="text-center mb-3">Đăng Ký Tài Khoản</h1>
        <p class="text-center text-muted mb-5">
            Tham gia cùng chúng tôi ngay hôm nay!
        </p>

        <div class="row g-4 align-items-center">

            <!-- Carousel -->
            <div class="col-12 col-lg-6">
                <div id="benefitCarousel"
                     class="carousel slide"
                     data-bs-ride="carousel">

                    <div class="carousel-inner rounded">

                        <!-- Slide 1 -->
                        <div class="carousel-item active">
                            <img
                                src="https://images.unsplash.com/photo-1497366216548-37526070297c?w=900&q=80"
                                class="d-block w-100 object-fit-cover"
                                style="height: 380px;"
                                alt="Không gian làm việc hiện đại">

                            <div class="carousel-caption d-block bg-dark bg-opacity-75 rounded p-2">
                                <h5>Dịch Vụ Chuyên Nghiệp</h5>
                                <p class="mb-0">
                                    Trải nghiệm dịch vụ chất lượng cao.
                                </p>
                            </div>
                        </div>

                        <!-- Slide 2 -->
                        <div class="carousel-item">
                            <img
                                src="https://images.unsplash.com/photo-1521737711867-e3b97375f902?w=900&q=80"
                                class="d-block w-100 object-fit-cover"
                                style="height: 380px;"
                                alt="Đội ngũ làm việc chuyên nghiệp">

                            <div class="carousel-caption d-block bg-dark bg-opacity-75 rounded p-2">
                                <h5>Đội Ngũ Tận Tâm</h5>
                                <p class="mb-0">
                                    Hỗ trợ khách hàng nhanh chóng.
                                </p>
                            </div>
                        </div>

                        <!-- Slide 3 -->
                        <div class="carousel-item">
                            <img
                                src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=900&q=80"
                                class="d-block w-100 object-fit-cover"
                                style="height: 380px;"
                                alt="Môi trường công nghệ hiện đại">

                            <div class="carousel-caption d-block bg-dark bg-opacity-75 rounded p-2">
                                <h5>Công Nghệ Hiện Đại</h5>
                                <p class="mb-0">
                                    Giải pháp tiện lợi và hiệu quả.
                                </p>
                            </div>
                        </div>

                    </div>

                    <!-- Nút chuyển ảnh -->
                    <button class="carousel-control-prev"
                            type="button"
                            data-bs-target="#benefitCarousel"
                            data-bs-slide="prev"
                            aria-label="Ảnh trước">
                        <span class="carousel-control-prev-icon"
                              aria-hidden="true"></span>
                    </button>

                    <button class="carousel-control-next"
                            type="button"
                            data-bs-target="#benefitCarousel"
                            data-bs-slide="next"
                            aria-label="Ảnh tiếp theo">
                        <span class="carousel-control-next-icon"
                              aria-hidden="true"></span>
                    </button>

                </div>
            </div>

            <!-- Form đăng ký -->
            <div class="col-12 col-lg-6">
                <div class="card shadow-sm p-4">
                    <h3 class="text-center mb-4">
                        Tạo Tài Khoản
                    </h3>

                    <form onsubmit="event.preventDefault()">

                        <!-- Họ tên -->
                        <div class="mb-3">
                            <label for="fullname" class="form-label">
                                Họ và tên
                            </label>
                            <input type="text"
                                   id="fullname"
                                   class="form-control"
                                   placeholder="Nhập họ và tên"
                                   required>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email
                            </label>

                            <div class="input-group">
                                <span class="input-group-text">@</span>
                                <input type="email"
                                       id="email"
                                       class="form-control"
                                       placeholder="Nhập email"
                                       required>
                            </div>
                        </div>

                        <!-- Mật khẩu -->
                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Mật khẩu
                            </label>
                            <input type="password"
                                   id="password"
                                   class="form-control"
                                   placeholder="Nhập mật khẩu"
                                   minlength="6"
                                   required>
                        </div>

                        <!-- Xác nhận mật khẩu -->
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">
                                Xác nhận mật khẩu
                            </label>
                            <input type="password"
                                   id="confirmPassword"
                                   class="form-control"
                                   placeholder="Nhập lại mật khẩu"
                                   minlength="6"
                                   required>
                        </div>

                        <!-- Nút đăng ký -->
                        <button type="submit"
                                class="btn btn-primary w-100">
                            Đăng Ký
                        </button>

                    </form>

                    <p class="text-center text-muted mt-3 mb-0">
                        Đăng ký để trải nghiệm dịch vụ của chúng tôi.
                    </p>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
